<title>Hoa Hồng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400;1,500&display=swap">
<style>
  :root{
    --ground:#060306;
    --ink:#f4e9ec;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:var(--ground);overflow:hidden}
  body{color:var(--ink)}
  canvas{display:block;width:100vw;height:100vh}

  .caption{
    position:fixed;left:clamp(16px,4vw,44px);bottom:clamp(18px,5vh,48px);
    font-family:"Cormorant Garamond",Georgia,serif;
    font-style:italic;font-weight:500;
    font-size:clamp(1.15rem,2.4vw,1.7rem);
    letter-spacing:.01em;line-height:1.3;
    color:var(--ink);opacity:0;
    text-shadow:0 1px 20px rgba(0,0,0,.7);
    animation:rise 2s ease .6s forwards;
    pointer-events:none;
  }
  .hint{
    position:fixed;right:clamp(16px,4vw,44px);bottom:clamp(18px,5vh,48px);
    max-width:min(46vw,320px);text-align:right;
    font:400 .72rem/1.5 system-ui,-apple-system,sans-serif;
    letter-spacing:.03em;
    color:color-mix(in srgb,var(--ink) 42%,transparent);
    opacity:0;animation:rise 2s ease 1.1s forwards;
    pointer-events:none;
  }
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){
    .caption,.hint{animation:none;opacity:1;transform:none}
  }
</style>

<canvas id="c"></canvas>
<p class="caption">Một đóa hồng nở trong đêm.</p>
<p class="hint">Di chuột (hoặc chạm kéo) để hoa nghiêng theo &middot; nhấn phím hoặc chạm để đổi sắc</p>

<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let W, H, CX, CY, S, DPR;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth || 800;
  H = innerHeight || 800;
  cv.width  = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  CX = W / 2;
  CY = H / 2;
  S = Math.max(Math.min(W, H) / 900, 0.32);
}
addEventListener('resize', resize);
resize();

// --- canh hoa roi trong khong gian ---
const petals = Array.from({length: 36}, () => spawn(true));
function spawn(init){
  return {
    x: Math.random() * W,
    y: init ? Math.random() * H : -20,
    s: 3 + Math.random() * 7,
    vy: 0.35 + Math.random() * 1.35,
    sway: 0.5 + Math.random() * 1.6,
    ph: Math.random() * Math.PI * 2,
    rot: Math.random() * Math.PI * 2,
    vr: (Math.random() - 0.5) * 0.05,
    hue: 340 + Math.random() * 32,
    alpha: 0.5 + Math.random() * 0.4
  };
}

let mx = 0;
addEventListener('pointermove', e => { mx = (e.clientX / W - 0.5) * 2; });

let hueShift = 0;
function shift(){ hueShift = (hueShift + 40) % 360; }
addEventListener('keydown', shift);
addEventListener('pointerdown', shift);

function petalPath(a, b){
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.bezierCurveTo(a * 0.55, -b * 0.2, a * 0.55, -b * 0.8, 0, -b);
  ctx.bezierCurveTo(-a * 0.55, -b * 0.8, -a * 0.55, -b * 0.2, 0, 0);
  ctx.closePath();
}

const M = reduce ? 0.25 : 1;   // he so bien do chuyen dong
let t = 0;

function frame(){
  t += 0.016;

  ctx.fillStyle = '#060306';
  ctx.fillRect(0, 0, W, H);

  const breath = 1 + 0.04 * Math.sin(t * 1.6) * M;
  const swayX  = (Math.sin(t * 0.7) * 18 * M + mx * 40) * S;
  const tilt   = Math.sin(t * 0.5) * 0.05 * M + mx * 0.12;

  // --- quang sang mo phia sau ---
  const R = 340 * S * breath;
  const g = ctx.createRadialGradient(CX + swayX, CY, 0, CX + swayX, CY, R);
  g.addColorStop(0, `hsla(${(345 + hueShift) % 360},82%,46%,0.30)`);
  g.addColorStop(0.5, `hsla(${(338 + hueShift) % 360},70%,30%,0.12)`);
  g.addColorStop(1, 'transparent');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // --- than va la ---
  ctx.save();
  ctx.translate(CX, CY);
  ctx.strokeStyle = '#0f3d1e';
  ctx.lineWidth = 8 * S;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(swayX * 0.15, 40 * S);
  ctx.quadraticCurveTo(swayX * 1.2, H * 0.3, swayX * 0.4, H * 0.5);
  ctx.stroke();
  for (const side of [1, -1]){
    ctx.save();
    ctx.translate(swayX * 0.24 * side + side * 8 * S, H * 0.24);
    ctx.rotate(side * 0.7 + Math.sin(t * 1.3 + side) * 0.1 * M);
    ctx.scale(S, S);
    ctx.fillStyle = '#15532b';
    petalPath(46, 90);
    ctx.fill();
    ctx.restore();
  }
  ctx.restore();

  // --- bong hoa: canh xep theo goc vang (phyllotaxis) ---
  ctx.save();
  ctx.translate(CX + swayX, CY);
  ctx.rotate(tilt + Math.sin(t * 0.3) * 0.15 * M);
  ctx.scale(breath, breath);

  const N = 90;
  const golden = 137.508 * Math.PI / 180;
  for (let i = N; i >= 1; i--){
    const f = i / N;                       // 0 = tam hoa, 1 = vanh ngoai
    const ang  = i * golden + Math.sin(t * 0.4) * 0.25 * M + f * 0.6;
    const dist = 150 * Math.pow(f, 0.78) * S;
    const px = Math.cos(ang) * dist;
    const py = Math.sin(ang) * dist * 0.92;
    const size  = (26 + 66 * f) * S;
    const hue   = (352 - 16 * f + hueShift + 360) % 360;
    const light = (16 + 40 * f) * (0.92 + 0.08 * Math.sin(t * 2 + i * 0.3) * M);
    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(ang + Math.PI + Math.sin(t * 1.2 + i) * 0.03 * M);
    ctx.fillStyle = `hsl(${hue}, ${72 - 16 * f}%, ${light}%)`;
    ctx.strokeStyle = `hsl(${hue}, 60%, ${light * 0.55}%)`;
    ctx.lineWidth = 1.2 * S;
    petalPath(size * 1.05, size);
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }
  ctx.fillStyle = '#2c0a12';
  ctx.beginPath();
  ctx.arc(0, 0, 10 * S, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // --- canh hoa roi ---
  for (let k = 0; k < petals.length; k++){
    const p = petals[k];
    p.y += p.vy * (reduce ? 0.4 : 1);
    p.x += Math.sin(t * 0.9 + p.ph) * p.sway * M;
    p.rot += p.vr * M;
    if (p.y > H + 20) petals[k] = spawn(false);
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.scale(p.s / 10, p.s / 10);
    ctx.fillStyle = `hsla(${(p.hue + hueShift) % 360}, 70%, 62%, ${p.alpha})`;
    petalPath(9, 13);
    ctx.fill();
    ctx.restore();
  }

  requestAnimationFrame(frame);
}
frame();
</script>
