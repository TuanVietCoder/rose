<title>Hoa Hồng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500;1,600&display=swap">
<style>
  :root{ --ground:#060306; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:var(--ground);overflow:hidden}
  canvas{display:block;width:100vw;height:100vh}

  .title{
    position:fixed;left:clamp(16px,4vw,52px);bottom:clamp(46px,10vh,88px);
    max-width:min(78vw,15ch);
    font-family:"Cormorant Garamond",Georgia,serif;
    font-style:italic;font-weight:600;
    font-size:clamp(1.7rem,5.2vw,3.1rem);
    letter-spacing:.005em;line-height:1.12;text-wrap:balance;
    color:#f4e9ec;text-shadow:0 2px 28px rgba(0,0,0,.75);
    opacity:0;animation:rise 2s ease .6s forwards;
    transition:color .9s ease,text-shadow .9s ease;
    pointer-events:none;
  }
  .hint{
    position:fixed;left:clamp(16px,4vw,52px);bottom:clamp(18px,5vh,44px);
    max-width:min(72vw,360px);
    font:400 .74rem/1.5 system-ui,-apple-system,sans-serif;letter-spacing:.03em;
    color:rgba(244,233,236,.4);
    opacity:0;animation:rise 2s ease 1.2s forwards;
    transition:color .9s ease;
    pointer-events:none;
  }
  body.day .title{ color:#4a2c33;text-shadow:0 1px 10px rgba(255,255,255,.85),0 0 2px rgba(255,255,255,.6) }
  body.day .hint{ color:rgba(74,44,51,.65) }

  /* thanh boi ngay */
  .bar{
    position:fixed;left:50%;top:clamp(14px,4vh,34px);
    transform:translateX(-50%) translateY(-18px);
    width:min(94vw,440px);
    background:rgba(255,255,255,.94);
    border:1px solid rgba(74,44,51,.12);border-radius:16px;
    padding:16px 18px 12px;
    box-shadow:0 14px 44px rgba(40,20,25,.24);
    color:#3a2b2f;z-index:10;
    opacity:0;pointer-events:none;
    transition:opacity .5s ease,transform .5s ease;
  }
  .bar.show{ opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto }
  .bar h3{
    font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:600;
    font-size:1.42rem;line-height:1.2;margin-bottom:8px;padding-right:18px;
  }
  .bar .row{ display:flex;gap:8px }
  .bar input{
    flex:1;min-width:0;font:400 1rem system-ui,sans-serif;
    padding:9px 12px;border:1px solid #d8c9cd;border-radius:10px;
    background:#fff;color:#3a2b2f;
  }
  .bar input:focus{ outline:2px solid #d98aa0;outline-offset:1px }
  .bar button.go{
    font:600 .9rem system-ui,sans-serif;padding:9px 16px;border:0;border-radius:10px;
    background:#c2415a;color:#fff;cursor:pointer;white-space:nowrap;
  }
  .bar button.go:hover{ background:#a83450 }
  .bar .fortune{
    font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;
    font-size:1.16rem;line-height:1.45;margin:2px 0 10px;
  }
  .bar .sent{ font:600 .8rem/1.4 system-ui,sans-serif;color:#3a7a3a;margin:-4px 0 10px }
  .bar .note{ display:block;margin-top:9px;font:400 .68rem/1.4 system-ui,sans-serif;color:#9a8a8f }
  .bar .close{
    position:absolute;top:7px;right:9px;background:0;border:0;
    font-size:.95rem;color:#9a8a8f;cursor:pointer;padding:5px;line-height:1;
  }

  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){
    .title,.hint{animation:none;opacity:1;transform:none}
    .bar{transition:opacity .3s ease}
  }
</style>

<canvas id="c"></canvas>
<p class="title">Tặng bạn bông hồng cuộc đời &mdash; thêm tươi!</p>
<p class="hint">Di chuột hoặc chạm kéo để hoa nghiêng theo &middot; chạm vào bông hoa để trời sáng lên (chạm lần nữa: về đêm)</p>

<div class="bar" id="bar" role="dialog" aria-label="Bói ngày hôm nay">
  <button class="close" id="barClose" type="button" aria-label="Đóng">✕</button>
  <h3>Tôi sẽ bói ngày hôm nay của bạn &mdash; nhập tên vào đây:</h3>
  <div class="row" id="barInput">
    <input id="barName" type="text" maxlength="40" placeholder="Tên của bạn" autocomplete="off" aria-label="Tên của bạn">
    <button class="go" id="barGo" type="button">Xem quẻ &amp; gửi tên</button>
  </div>
  <div id="barResult" hidden>
    <p class="fortune" id="barText" aria-live="polite"></p>
    <p class="sent" id="barSent" hidden>Tuấn Việt cảm ơn bạn vì đã vào wall facebook của Tuấn Việt✓</p>
    <button class="go" id="barAgain" type="button">Bói lại</button>
  </div>
  
</div>

<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let W, H, CX, CY, S, DPR;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth || 800;
  H = innerHeight || 800;
  cv.width  = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  CX = W / 2; CY = H / 2;
  S = Math.max(Math.min(W, H) / 900, 0.32);
}
addEventListener('resize', resize);
resize();

// --- canh hoa roi (ban dem) ---
const petals = Array.from({length: 36}, () => spawn(true));
function spawn(init){
  return {
    x: Math.random() * W,
    y: init ? Math.random() * H : -20,
    s: 3 + Math.random() * 7,
    vy: 0.35 + Math.random() * 1.35,
    sway: 0.5 + Math.random() * 1.6,
    ph: Math.random() * Math.PI * 2,
    rot: Math.random() * Math.PI * 2,
    vr: (Math.random() - 0.5) * 0.05,
    hue: 340 + Math.random() * 32,
    alpha: 0.5 + Math.random() * 0.4
  };
}

// --- may (ban ngay) ---
const clouds = [
  { x: 0.18, y: 0.13, s: 1.15, v: 0.22 },
  { x: 0.62, y: 0.20, s: 0.85, v: 0.15 },
  { x: 0.85, y: 0.30, s: 1.0,  v: 0.30 },
  { x: 0.40, y: 0.09, s: 0.7,  v: 0.10 }
].map(c => ({ ...c, x: c.x * (W || 800) }));

// --- dong co + hoa dai (ban ngay), vi tri random co dinh ---
function mulberry32(seed){
  return function(){
    seed = seed + 0x6D2B79F5 | 0;
    let x = Math.imul(seed ^ seed >>> 15, 1 | seed);
    x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x;
    return ((x ^ x >>> 14) >>> 0) / 4294967296;
  };
}
const rnd = mulberry32(20260828);
const blades = Array.from({ length: 175 }, () => ({
  fx: rnd(), depth: rnd(), phase: rnd() * 6.283, lean: rnd() - 0.5, vy: rnd()
}));
const wild = Array.from({ length: 72 }, () => ({
  fx: rnd(), fy: rnd(), size: 0.6 + rnd() * 0.9,
  white: rnd() < 0.14, petals: rnd() < 0.5 ? 5 : 6, phase: rnd() * 6.283
}));

let mx = 0;
addEventListener('pointermove', e => { mx = (e.clientX / W - 0.5) * 2; });

// --- bo bay: moi lan chuyen sang ngay se them 1 con o do cao random ---
const cows = [];
function addCow(){
  if (cows.length >= 12) return;
  cows.push({
    x: Math.random() * W,
    y: (0.05 + Math.random() * 0.42) * H,
    dir: Math.random() < 0.5 ? 1 : -1,
    spd: 0.4 + Math.random() * 1.2,
    sc: 0.62 + Math.random() * 0.6,
    ph: Math.random() * 6.283
  });
}

// --- bam vao hoa => chuyen ngay / dem ---
let day = 0, dayTarget = 0;
let curCX = CX;
const bar = document.getElementById('bar');
let barArmed = false;
function toggleDay(){
  dayTarget = dayTarget < 0.5 ? 1 : 0;
  document.body.classList.toggle('day', dayTarget > 0.5);
  if (dayTarget > 0.5){
    addCow();
    if (!barArmed){ barArmed = true; setTimeout(() => bar.classList.add('show'), 1100); }
  }
}
addEventListener('keydown', e => {
  if (e.target.closest('.bar')) return;
  toggleDay();
});
addEventListener('pointerdown', e => {
  if (e.target.closest('.bar')) return;
  const dx = e.clientX - curCX;
  const dy = e.clientY - CY;
  if (Math.hypot(dx, dy) < 230 * S) toggleDay();
});

// --- boi ngay (chay hoan toan tai trinh duyet, khong gui di dau) ---
const F_MOOD = [
  'rực rỡ và nhiều tiếng cười', 'bình yên đến bất ngờ', 'may mắn gõ cửa lúc bạn không ngờ nhất',
  'tràn đầy năng lượng', 'dịu dàng như nắng sớm', 'hơi lười một chút nhưng vui',
  'đầy cảm hứng để bắt đầu điều mới', 'thong dong, chẳng vội điều gì'
];
const F_LUCK = [
  'Màu hợp với bạn hôm nay: đỏ hồng.', 'Con số may mắn của bạn: {n}.',
  'Gặp người mặc áo xanh, bạn sẽ có tin vui.', 'Một tin nhắn cũ sẽ khiến bạn mỉm cười.',
  'Đừng bỏ bữa sáng — hôm nay bạn cần sức.', 'Việc bạn ngại nhất hoá ra lại dễ nhất.',
  'Buổi chiều sẽ có một điều nho nhỏ dễ thương.'
];
const F_ADVICE = [
  'Cứ mạnh dạn nhắn tin trước.', 'Nghỉ tay 10 phút và pha một tách trà.',
  'Nói lời cảm ơn với một người hôm nay.', 'Bắt đầu việc khó ngay từ buổi sáng.',
  'Tối nay ngủ sớm hơn 30 phút nhé.', 'Tin vào linh cảm đầu tiên của bạn.'
];
function hashStr(s){
  let h = 2166136261;
  for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function tellFortune(raw){
  const name = raw.trim();
  const h = hashStr(name.toLowerCase() + '|' + new Date().toDateString());
  const mood = F_MOOD[h % F_MOOD.length];
  const luck = F_LUCK[(h >>> 3) % F_LUCK.length].replace('{n}', (h % 9) + 1);
  const adv  = F_ADVICE[(h >>> 7) % F_ADVICE.length];
  const star = 3 + (h % 3);
  return `${name || 'Bạn'} ơi, ngày hôm nay của bạn sẽ ${mood}. ${luck} `
       + `Lời khuyên nhỏ: ${adv} ${'★'.repeat(star)}${'☆'.repeat(5 - star)}`;
}
// === Gui ten nguoi xem ve cho chu trang qua Google Form ===
// Dien 2 gia tri duoi day tu Google Form cua ban (lay tu "link dien san"):
//   FORM_ACTION = URL form ket thuc bang /formResponse
//   FORM_ENTRY  = ten truong dang "entry.1234567890"
// De trong ca hai => chi boi tai cho, khong gui gi.
const FORM_ACTION = 'https://docs.google.com/forms/d/e/1FAIpQLScbhzYFk-bokMXRsBiqWb93v6PYjWEywi8Q9F7SSBxdGIzTBw/formResponse';
const FORM_ENTRY  = 'entry.456818756';

const barInput  = document.getElementById('barInput');
const barResult = document.getElementById('barResult');
const barName   = document.getElementById('barName');
const barText   = document.getElementById('barText');
const barSent   = document.getElementById('barSent');
function sendName(raw){
  const name = raw.trim();
  if (!FORM_ACTION || !FORM_ENTRY || !name) return;
  const data = new FormData();
  data.append(FORM_ENTRY, name);
  fetch(FORM_ACTION, { method: 'POST', mode: 'no-cors', body: data }).catch(() => {});
  barSent.hidden = false;
}
function runFortune(){
  barText.textContent = tellFortune(barName.value);
  sendName(barName.value);
  barInput.hidden = true;
  barResult.hidden = false;
}
// neu chua cau hinh Form: khong hua hen chuyen gui di
if (!FORM_ACTION || !FORM_ENTRY){
  document.getElementById('barGo').textContent = 'Xem quẻ';
  document.querySelector('.bar .note').textContent =
    'Tên chỉ dùng ngay tại trình duyệt để bói cho vui.';
}
document.getElementById('barGo').addEventListener('click', runFortune);
barName.addEventListener('keydown', e => { if (e.key === 'Enter') runFortune(); });
document.getElementById('barAgain').addEventListener('click', () => {
  barInput.hidden = false;
  barResult.hidden = true;
  barSent.hidden = true;
  barName.value = '';
  barName.focus();
});
document.getElementById('barClose').addEventListener('click', () => bar.classList.remove('show'));

function petalPath(a, b){
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.bezierCurveTo(a * 0.55, -b * 0.2, a * 0.55, -b * 0.8, 0, -b);
  ctx.bezierCurveTo(-a * 0.55, -b * 0.8, -a * 0.55, -b * 0.2, 0, 0);
  ctx.closePath();
}

const M = reduce ? 0.25 : 1;
let t = 0;

function drawSun(a){
  const sx = CX + 215 * S;
  const sy = (CY - 30 * S) - a * 190 * S;      // moc len tu tu
  ctx.save();
  ctx.globalAlpha = a;
  const gg = ctx.createRadialGradient(sx, sy, 0, sx, sy, 170 * S);
  gg.addColorStop(0, 'rgba(255,238,180,0.95)');
  gg.addColorStop(0.4, 'rgba(255,214,120,0.35)');
  gg.addColorStop(1, 'transparent');
  ctx.fillStyle = gg;
  ctx.beginPath(); ctx.arc(sx, sy, 170 * S, 0, Math.PI * 2); ctx.fill();

  ctx.save();
  ctx.translate(sx, sy);
  ctx.rotate(t * 0.05 * M);
  ctx.strokeStyle = 'rgba(255,220,130,0.6)';
  ctx.lineWidth = 3 * S;
  ctx.lineCap = 'round';
  for (let k = 0; k < 12; k++){
    ctx.rotate(Math.PI / 6);
    const len = (54 + 9 * Math.sin(t * 2 + k)) * S;
    ctx.beginPath();
    ctx.moveTo(0, 40 * S);
    ctx.lineTo(0, len);
    ctx.stroke();
  }
  ctx.restore();

  ctx.fillStyle = '#ffd452';
  ctx.beginPath(); ctx.arc(sx, sy, 33 * S, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ffe89a';
  ctx.beginPath(); ctx.arc(sx - 6 * S, sy - 6 * S, 22 * S, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function puff(cx, cy, r){ ctx.moveTo(cx + r, cy); ctx.arc(cx, cy, r, 0, Math.PI * 2); }
function drawClouds(a){
  ctx.save();
  ctx.globalAlpha = a * 0.95;
  for (const c of clouds){
    c.x += c.v * (reduce ? 0.3 : 1);
    if (c.x > W + 160) c.x = -160;
    const cx = c.x, cy = c.y * H, s = c.s * S;
    const grad = ctx.createLinearGradient(cx, cy - 30 * s, cx, cy + 24 * s);
    grad.addColorStop(0, '#ffffff');
    grad.addColorStop(1, '#d7e6f2');
    ctx.fillStyle = grad;
    ctx.beginPath();
    puff(cx - 34 * s, cy + 6 * s, 20 * s);
    puff(cx - 10 * s, cy - 8 * s, 26 * s);
    puff(cx + 18 * s, cy - 4 * s, 22 * s);
    puff(cx + 38 * s, cy + 8 * s, 18 * s);
    puff(cx,          cy + 12 * s, 24 * s);
    ctx.fill();
  }
  ctx.restore();
}

function drawCow(c, a){
  c.x += c.dir * c.spd * (reduce ? 0.4 : 1);
  const pad = 90 * S;
  if (c.x < -pad) c.x = W + pad;
  if (c.x > W + pad) c.x = -pad;

  const s = c.sc * S;
  ctx.save();
  ctx.globalAlpha = a;
  ctx.translate(c.x, c.y + Math.sin(t * 1.2 + c.ph) * 6 * S);
  ctx.scale(c.dir, 1);
  ctx.lineJoin = 'round';

  // canh (vo canh)
  const wf = Math.sin(t * 9 + c.ph) * 0.55;
  ctx.fillStyle = 'rgba(255,255,255,0.92)';
  ctx.strokeStyle = 'rgba(150,170,190,0.5)';
  ctx.lineWidth = 1 * s;
  for (const side of [-1, 1]){
    ctx.save();
    ctx.translate(side * 7 * s, -13 * s);
    ctx.rotate(side * (0.5 - wf));
    ctx.beginPath();
    ctx.ellipse(0, -11 * s, 8 * s, 15 * s, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  // chan
  ctx.strokeStyle = '#d7b3a2';
  ctx.lineWidth = 3.2 * s;
  ctx.lineCap = 'round';
  for (const lx of [-14, -5, 6, 15]){
    ctx.beginPath();
    ctx.moveTo(lx * s, 11 * s);
    ctx.lineTo(lx * s + Math.sin(t * 3 + lx) * 2 * s, 22 * s);
    ctx.stroke();
  }

  // duoi
  ctx.strokeStyle = '#fdfdfb';
  ctx.lineWidth = 2.4 * s;
  ctx.beginPath();
  ctx.moveTo(-25 * s, -2 * s);
  ctx.quadraticCurveTo(-34 * s, 3 * s + Math.sin(t * 2 + c.ph) * 3 * s, -31 * s, 11 * s);
  ctx.stroke();
  ctx.fillStyle = '#4a3b3f';
  ctx.beginPath(); ctx.arc(-31 * s, 12 * s, 2.3 * s, 0, Math.PI * 2); ctx.fill();

  // than
  ctx.fillStyle = '#fdfdfb';
  ctx.beginPath(); ctx.ellipse(0, 0, 25 * s, 15 * s, 0, 0, Math.PI * 2); ctx.fill();

  // dom
  ctx.fillStyle = '#4a3b3f';
  ctx.beginPath(); ctx.ellipse(-8 * s, -3 * s, 6 * s, 4.6 * s, 0.3, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(8 * s, 4 * s, 5 * s, 3.8 * s, -0.4, 0, Math.PI * 2); ctx.fill();

  // dau
  ctx.fillStyle = '#fdfdfb';
  ctx.beginPath(); ctx.ellipse(23 * s, -5 * s, 11 * s, 9 * s, 0.2, 0, Math.PI * 2); ctx.fill();
  // sung + tai
  ctx.fillStyle = '#e7dcc0';
  ctx.beginPath();
  ctx.moveTo(20 * s, -12 * s); ctx.lineTo(22 * s, -21 * s); ctx.lineTo(25 * s, -12 * s);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#fdfdfb';
  ctx.beginPath(); ctx.ellipse(16 * s, -11 * s, 4 * s, 2.5 * s, -0.5, 0, Math.PI * 2); ctx.fill();
  // mom
  ctx.fillStyle = '#f4c1d0';
  ctx.beginPath(); ctx.ellipse(30 * s, -1 * s, 6 * s, 5 * s, 0.15, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#c98fa3';
  ctx.beginPath(); ctx.arc(29 * s, 0, 0.9 * s, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(32 * s, -1 * s, 0.9 * s, 0, Math.PI * 2); ctx.fill();
  // mat
  ctx.fillStyle = '#3a2b2f';
  ctx.beginPath(); ctx.arc(26 * s, -7 * s, 1.5 * s, 0, Math.PI * 2); ctx.fill();

  ctx.restore();
}

function grassBlade(bx, by, bh, sw, w, col){
  ctx.strokeStyle = col;
  ctx.lineWidth = w;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(bx, by);
  ctx.quadraticCurveTo(bx + sw * 0.45, by - bh * 0.62, bx + sw, by - bh);
  ctx.stroke();
}

function wildFlower(wx, wy, sc, w){
  ctx.save();
  ctx.translate(wx, wy);
  // cuong
  ctx.strokeStyle = '#57a13a';
  ctx.lineWidth = Math.max(0.7, 0.5 * sc);
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(Math.sin(t + w.phase) * 1.4 * sc, -3.6 * sc, 0, -6.4 * sc);
  ctx.stroke();
  ctx.translate(0, -6.4 * sc);
  ctx.rotate(Math.sin(t * 1.5 + w.phase) * 0.1 * M);
  // canh hoa
  const pc = w.white ? '#fbfbef' : '#ffd21e';
  const cc = w.white ? '#ffcf2e' : '#f0990f';
  for (let k = 0; k < w.petals; k++){
    ctx.rotate(Math.PI * 2 / w.petals);
    ctx.fillStyle = pc;
    ctx.beginPath();
    ctx.ellipse(0, -2.3 * sc, 1.15 * sc, 2.3 * sc, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.fillStyle = cc;
  ctx.beginPath();
  ctx.arc(0, 0, 1.15 * sc, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.5)';
  ctx.beginPath();
  ctx.arc(-0.4 * sc, -0.4 * sc, 0.45 * sc, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawMeadow(a){
  const hz = CY + 84 * S;
  const edge = x => hz + Math.sin(x * 0.012 + t * 0.4) * 5 * S + Math.sin(x * 0.045 + 1.7) * 2.5 * S;
  ctx.save();
  ctx.globalAlpha = a;

  // than co
  const grad = ctx.createLinearGradient(0, hz - 26 * S, 0, H);
  grad.addColorStop(0,    '#b6e05f');
  grad.addColorStop(0.32, '#82c247');
  grad.addColorStop(0.68, '#57a033');
  grad.addColorStop(1,    '#3a7726');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(0, edge(0));
  for (let x = 24; x <= W; x += 24) ctx.lineTo(x, edge(x));
  ctx.lineTo(W, H); ctx.lineTo(0, H);
  ctx.closePath();
  ctx.fill();

  // vien nang mep co
  ctx.strokeStyle = 'rgba(226,247,158,0.55)';
  ctx.lineWidth = 3 * S;
  ctx.lineCap = 'round';
  ctx.beginPath();
  for (let x = 0; x <= W; x += 24) x === 0 ? ctx.moveTo(x, edge(x)) : ctx.lineTo(x, edge(x));
  ctx.stroke();

  // lop co xa: thap, nhat, mo, sat chan troi
  for (const b of blades){
    if (b.depth >= 0.5) continue;
    const bx = b.fx * W;
    const by = edge(bx) + (2 + b.depth * 22) * S;
    const bh = (8 + b.depth * 24) * S;
    const sw = (Math.sin(t * 1.3 + b.phase) * 5 + b.lean * 9) * S * M;
    grassBlade(bx, by, bh, sw, 1.5 * S,
      `hsl(${94 + b.depth * 22}, 44%, ${50 + b.depth * 8}%)`);
  }

  // hoa vang li ti rai khap dong co
  for (const w of wild){
    const wx = w.fx * W;
    const t01 = w.fy;
    const yy = edge(wx) + 8 * S + t01 * (H - edge(wx) - 14 * S);
    const sc = (2.2 + t01 * 5.2) * w.size * S;
    wildFlower(wx, yy, sc, w);
  }

  // lop co gan: cao, dam, sac net, rai rac khap dong (phu truoc hoa dai)  // lop co gan: cao, dam, sac net, rai rac khap dong (phu truoc hoa dai)
  for (const b of blades){
    if (b.depth < 0.5) continue;
    const bx = b.fx * W;
    const root = edge(bx) + 6 * S + b.vy * (H - edge(bx) - 30 * S) * 0.72;
    const near = 0.45 + (b.vy * 0.9 + b.depth * 0.5);   // cang xuong duoi cang cao
    const bh = (18 + near * 44) * S;
    const sw = (Math.sin(t * 1.6 + b.phase) * 8 + b.lean * 12) * S * M;
    grassBlade(bx, root, bh, sw, (1.4 + near * 1.3) * S,
      `hsl(${100 + b.depth * 14}, ${46 + b.depth * 14}%, ${22 + b.vy * 16}%)`);
  }

  // cum co day quanh goc hoa
  for (let i = -10; i <= 10; i++){
    const gx = curCX + i * 10 * S;
    const bh = (38 + (10 - Math.abs(i)) * 6) * S;
    const sw = Math.sin(t * 1.7 + i) * 9 * S * M;
    grassBlade(gx, CY + 150 * S, bh, sw, 2.2 * S, i % 2 ? '#4f9a34' : '#3d7d28');
  }

  ctx.restore();
}

function frame(){
  t += 0.016;
  day += (dayTarget - day) * 0.045;
  const night = 1 - day;

  // nen dem
  ctx.fillStyle = '#060306';
  ctx.fillRect(0, 0, W, H);

  // troi sang: bau troi sang truoc, roi mat troi / may / co hien dan
  const dv = Math.max(0, (day - 0.12) / 0.88);
  if (day > 0.002){
    ctx.save();
    ctx.globalAlpha = day;
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#bfe0f5');
    sky.addColorStop(0.55, '#e9f4fb');
    sky.addColorStop(1, '#ffffff');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
    if (dv > 0.002){
      drawSun(dv);
      drawClouds(dv);
      for (const c of cows) drawCow(c, dv);
    }
  }

  const breath = 1 + 0.04 * Math.sin(t * 1.6) * M;
  const swayX  = (Math.sin(t * 0.7) * 18 * M + mx * 40) * S;
  const tilt   = Math.sin(t * 0.5) * 0.05 * M + mx * 0.12;
  curCX = CX + swayX;

  // quang sang magenta (ban dem)
  if (night > 0.002){
    ctx.save();
    ctx.globalAlpha = night;
    const R = 340 * S * breath;
    const g = ctx.createRadialGradient(curCX, CY, 0, curCX, CY, R);
    g.addColorStop(0, 'hsla(345,82%,46%,0.30)');
    g.addColorStop(0.5, 'hsla(338,70%,30%,0.12)');
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  // dong co quanh hoa (ban ngay)
  if (dv > 0.002) drawMeadow(dv);

  // than va la
  ctx.save();
  ctx.translate(CX, CY);
  ctx.strokeStyle = '#0f3d1e';
  ctx.lineWidth = 8 * S;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(swayX * 0.15, 40 * S);
  ctx.quadraticCurveTo(swayX * 1.2, H * 0.3, swayX * 0.4, H * 0.5);
  ctx.stroke();
  for (const side of [1, -1]){
    ctx.save();
    ctx.translate(swayX * 0.24 * side + side * 8 * S, H * 0.24);
    ctx.rotate(side * 0.7 + Math.sin(t * 1.3 + side) * 0.1 * M);
    ctx.scale(S, S);
    ctx.fillStyle = '#15532b';
    petalPath(46, 90);
    ctx.fill();
    ctx.restore();
  }
  ctx.restore();

  // bong hoa
  ctx.save();
  ctx.translate(curCX, CY);
  ctx.rotate(tilt + Math.sin(t * 0.3) * 0.15 * M);
  ctx.scale(breath, breath);
  const N = 90;
  const golden = 137.508 * Math.PI / 180;
  for (let i = N; i >= 1; i--){
    const f = i / N;
    const ang  = i * golden + Math.sin(t * 0.4) * 0.25 * M + f * 0.6;
    const dist = 150 * Math.pow(f, 0.78) * S;
    const px = Math.cos(ang) * dist;
    const py = Math.sin(ang) * dist * 0.92;
    const size  = (26 + 66 * f) * S;
    const hue   = (352 - 16 * f + 360) % 360;
    const light = (16 + 40 * f) * (0.92 + 0.08 * Math.sin(t * 2 + i * 0.3) * M);
    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(ang + Math.PI + Math.sin(t * 1.2 + i) * 0.03 * M);
    ctx.fillStyle = `hsl(${hue}, ${72 - 16 * f}%, ${light}%)`;
    ctx.strokeStyle = `hsl(${hue}, 60%, ${light * 0.55}%)`;
    ctx.lineWidth = 1.2 * S;
    petalPath(size * 1.05, size);
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }
  ctx.fillStyle = '#2c0a12';
  ctx.beginPath();
  ctx.arc(0, 0, 10 * S, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // canh hoa roi (nhat dan khi troi sang)
  const pa = 1 - day * 0.78;
  if (pa > 0.02){
    for (let k = 0; k < petals.length; k++){
      const p = petals[k];
      p.y += p.vy * (reduce ? 0.4 : 1);
      p.x += Math.sin(t * 0.9 + p.ph) * p.sway * M;
      p.rot += p.vr * M;
      if (p.y > H + 20) petals[k] = spawn(false);
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.scale(p.s / 10, p.s / 10);
      ctx.fillStyle = `hsla(${p.hue % 360}, 70%, 62%, ${p.alpha * pa})`;
      petalPath(9, 13);
      ctx.fill();
      ctx.restore();
    }
  }

  requestAnimationFrame(frame);
}
frame();
</script>
